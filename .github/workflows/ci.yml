name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep-ce/scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Semgrep CE on pull request changes
        if: github.event_name == 'pull_request'
        run: |
          BASELINE_COMMIT="$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")"
          semgrep scan --config auto --baseline-commit "$BASELINE_COMMIT" --error

      - name: Run Semgrep CE on pushed changes
        if: github.event_name != 'pull_request'
        run: |
          BASELINE_COMMIT="$(git rev-parse HEAD^)"
          semgrep scan --config auto --baseline-commit "$BASELINE_COMMIT" --error

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Repository check
        run: npm run check

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: >
          git diff --check
          "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check pushed commit diff
        if: github.event_name == 'push'
        shell: bash
        run: |
          before="${{ github.event.before }}"
          current="${{ github.sha }}"

          if [[ -n "$before" && ! "$before" =~ ^0+$ ]]; then
            git diff --check "$before...$current"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check "HEAD^...HEAD"
          else
            git diff --check
          fi
