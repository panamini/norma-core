<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000" role="img" aria-labelledby="title description">
  <title id="title">Norma golden split editorial poster</title>
  <description id="description">A dark landscape panel beside a warm editorial panel, split at the golden ratio.</description>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset="0.52" stop-color="#12364b"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffb16f"/>
      <stop offset="0.5" stop-color="#f26a32"/>
      <stop offset="1" stop-color="#9f271f"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff5c7"/>
      <stop offset="0.45" stop-color="#ffd278"/>
      <stop offset="1" stop-color="#f47b3b"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="url(#night)"/>
  <rect x="1000" width="618" height="1000" fill="url(#ember)"/>
  <rect width="1618" height="1000" fill="url(#grid)"/>

  <circle cx="618" cy="382" r="188" fill="#ff9b54" opacity="0.26" filter="url(#glow)"/>
  <circle cx="618" cy="382" r="136" fill="url(#sun)"/>
  <path d="M0 742 L176 587 L292 676 L482 468 L648 658 L760 552 L1000 735 L1000 1000 L0 1000 Z" fill="#112839"/>
  <path d="M0 826 L155 702 L282 790 L422 651 L594 804 L763 694 L1000 853 L1000 1000 L0 1000 Z" fill="#07131f"/>
  <path d="M418 651 L482 468 L538 623 L489 590 Z" fill="#dcecff" opacity="0.86"/>
  <path d="M704 635 L760 552 L803 650 L763 623 Z" fill="#dcecff" opacity="0.66"/>

  <g fill="#eef8ff">
    <text x="72" y="92" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="7">NORMA / PERSONAL STUDY 01</text>
    <text x="70" y="186" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="900" letter-spacing="-3">VOIR LA</text>
    <text x="70" y="263" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="900" letter-spacing="-3">STRUCTURE</text>
  </g>
  <text x="74" y="930" fill="#a9c5d5" font-family="Inter,Arial,sans-serif" font-size="20" letter-spacing="3">IMAGE → CANDIDATS → CONFIRMATION → CORE</text>

  <line x1="1000" y1="0" x2="1000" y2="1000" stroke="#fff3df" stroke-opacity="0.7" stroke-width="3"/>
  <g transform="translate(1060 82)" fill="#1e0d0a">
    <text x="0" y="0" dominant-baseline="hanging" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850" letter-spacing="5">THE GOLDEN CUT</text>
    <text x="0" y="95" font-family="Georgia,serif" font-size="126" font-style="italic" font-weight="700">φ</text>
    <text x="130" y="94" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="900">61.8</text>
    <text x="132" y="130" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="3">PERCENT</text>
    <line x1="0" y1="194" x2="494" y2="194" stroke="#35110e" stroke-opacity="0.45" stroke-width="2"/>
    <text x="0" y="256" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="900">A relation,</text>
    <text x="0" y="304" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="900">not a verdict.</text>
    <text x="0" y="378" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="650">Norma measures declared geometric</text>
    <text x="0" y="410" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="650">relationships after you confirm what</text>
    <text x="0" y="442" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="650">the vision model proposed.</text>
  </g>

  <g transform="translate(1060 660)">
    <rect width="494" height="236" rx="28" fill="#210d0c" fill-opacity="0.88"/>
    <circle cx="52" cy="54" r="18" fill="#ffb16f"/>
    <text x="88" y="62" fill="#fff4e8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="850">DETERMINISTIC CORE</text>
    <text x="40" y="124" fill="#f6c3a4" font-family="Inter,Arial,sans-serif" font-size="16" letter-spacing="2">WIDTH SHARE</text>
    <text x="40" y="174" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="900">1000 : 618</text>
    <text x="40" y="208" fill="#d79c7f" font-family="Inter,Arial,sans-serif" font-size="14">canonical result identity included</text>
  </g>
</svg>
